name: CI

# CI runs the same six verification steps as `npm run preflight` on push and pull requests.
# Keep the step list in sync with the `preflight` script in package.json.
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "integration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      # Actions pinned to commit SHA (verified via git ls-remote) per the
      # GitHub Actions security-hardening guidance on third-party actions.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # npm ci validates package-lock.json (npm install never did); no global npm
      # downgrade, no legacy-peer-deps - CI must match local installs exactly.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # build precedes test: the setup-entry and cli-env suites exercise the
      # compiled dist/cli.js and dist/mcp/server.js, which do not exist on a
      # fresh checkout.
      - run: npm run build
      - run: npm test
      - run: npm run mcp:smoke
      - run: npm run plugin:build
      - run: npm run format:check
