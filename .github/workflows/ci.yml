name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install -g npm@10.8.2
      - run: npm install --no-audit --no-fund --legacy-peer-deps --install-strategy=nested
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
