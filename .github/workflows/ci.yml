name: CI

# CI runs the same seven verification steps as `npm run preflight` on push and pull requests.
# Keep the step list in sync with the `preflight` script in package.json.
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "integration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows matters: the setup containment and --out path-guard suites are win32-only
    # and skip on Linux, so an Ubuntu-only matrix never exercises the junction / UNC /
    # ADS / reserved-device-name checks.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      # Every step below is a plain `npm run ...` call, so it works unchanged under the
      # Windows runner's default pwsh shell; no bash-only syntax is used.
      # Actions pinned to commit SHA (verified via git ls-remote) per the
      # GitHub Actions security-hardening guidance on third-party actions.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24 runtime)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24 runtime)
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # npm ci validates package-lock.json (npm install never did); no global npm
      # downgrade, no legacy-peer-deps - CI must match local installs exactly.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # build precedes test: the setup-entry and cli-env suites exercise the
      # compiled dist/cli.js and dist/mcp/server.js, which do not exist on a
      # fresh checkout.
      - run: npm run build
      - run: npm test
      - run: npm run mcp:smoke
      - run: npm run plugin:build
      - run: npm run format:check
